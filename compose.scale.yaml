# Horizontal scaling demo. Usage:
#   docker compose -f compose.yaml -f compose.scale.yaml -p kervan-scale up --build --scale app=3
#
# Notes:
# - A separate project name gives this stack its own volumes/network, separate from dev.
# - Stop the dev stack first: both stacks publish the same host ports for postgres/rabbitmq/redis.
# - Spring Boot's docker-compose support only reads compose.yaml, so normal dev startup is unaffected.

services:
  postgres:
    command: ["postgres", "-c", "max_connections=200"]
    # Each app replica opens up to 20 connections (Hikari); replicas * 20 + headroom must stay below this.

  app:
    build: .
    # No ports: replicas cannot share a host port. nginx is the entry point.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      # Container ports are set explicitly. The same names in .env are host-side port mappings for dev.
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      KERVAN_JWT_SECRET: ${KERVAN_JWT_SECRET:?set KERVAN_JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    cpus: "1.0"
    mem_limit: 768m
    # Fixed budget per replica so 1 vs 3 replicas is a fair comparison.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
