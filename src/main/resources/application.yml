spring:
  application:
    name: kervan
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false  # no lazy loading in controllers/views
    hibernate:
      ddl-auto: validate  # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 50  # loads lazy collections in IN(...) batches to reduce N+1
  flyway:
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      key-prefix: 'kervan:'
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false  # failed messages go to the DLQ instead of looping forever
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
