spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20  # with virtual threads the connection pool, not threads, is the bottleneck
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
kervan:
  jwt:
    secret: ${KERVAN_JWT_SECRET}  # no default on purpose; the app must fail to start without it
  admin:
    # optional: when both are set and no admin exists yet, one is created at startup
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
