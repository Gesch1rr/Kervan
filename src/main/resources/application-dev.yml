# Datasource, Redis and RabbitMQ connections come from compose.yaml via spring-boot-docker-compose,
# so they are not configured here.
logging:
  level:
    "[org.hibernate.SQL]": debug
management:
  endpoint:
    health:
      show-details: always
kervan:
  jwt:
    secret: dev-only-secret-0123456789abcdef0123456789abcdef  # dev-only value, never use in prod
