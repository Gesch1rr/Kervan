worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS. Re-resolve "app" every 10s so all replicas are found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The upstream address in the log shows which replica served a request.
    log_format upstream '$remote_addr "$request" $status $request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream;

    # Round robin across app replicas.
    upstream kervan {
        zone kervan 64k;
        server app:8080 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://kervan;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Passive health checks: active checks are nginx Plus only.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
